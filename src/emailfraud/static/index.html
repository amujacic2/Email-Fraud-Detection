<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Fraud Detection</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --text:#e8ecf4; --muted:#8b95ab; --line:#27304a;
          --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --accent:#6366f1; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6fa; --card:#fff; --text:#1b2030; --muted:#5b6479; --line:#dde1ec; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:32px 16px 64px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  textarea { width:100%; min-height:240px; padding:14px; border-radius:12px; border:1px solid var(--line);
             background:var(--card); color:var(--text); font:14px/1.5 ui-monospace, Consolas, monospace; resize:vertical; }
  .row { display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; }
  button { padding:10px 18px; border-radius:10px; border:1px solid var(--line); background:var(--card);
           color:var(--text); font-size:15px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #result { display:none; margin-top:20px; padding:20px; border-radius:12px; background:var(--card); border:1px solid var(--line); }
  .verdict { font-size:22px; font-weight:700; }
  .bar { height:10px; border-radius:6px; background:var(--line); margin:12px 0; overflow:hidden; }
  .bar > div { height:100%; width:0; transition:width .4s; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip { padding:4px 10px; border-radius:999px; border:1px solid var(--line); font-size:13px; color:var(--muted); }
  .error { color:var(--bad); margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>Email Fraud Detection</h1>
  <p class="sub">Paste a raw email (with headers if you have them) and get a fraud score with explainable signals.</p>
  <label for="raw" class="sub">Raw email</label>
  <textarea id="raw" placeholder="From: ...&#10;Subject: ...&#10;&#10;Body"></textarea>
  <div class="row">
    <button class="primary" id="scan">Scan email</button>
    <button id="ex-bad">Load phishing example</button>
    <button id="ex-ok">Load legitimate example</button>
  </div>
  <div id="err" class="error" role="alert"></div>
  <section id="result" aria-live="polite">
    <div class="verdict" id="verdict"></div>
    <div class="bar"><div id="fill"></div></div>
    <div id="detail" class="sub"></div>
    <div class="chips" id="chips"></div>
  </section>
</main>
<script>
const EX = {
  bad: "From: \"PayPal\" <security@paypa1-alerts.xyz>\nReply-To: help@mail.ru\nAuthentication-Results: mx; spf=fail; dmarc=fail\nSubject: URGENT: account suspended\n\nVerify your account immediately: http://185.23.44.9/login and enter your password!!!",
  ok: "From: sam@company.com\nSubject: Notes from the design review\n\nHi team, attached are the notes from today's design review. Let me know if I missed anything."
};
const $ = id => document.getElementById(id);
$("ex-bad").onclick = () => $("raw").value = EX.bad;
$("ex-ok").onclick = () => $("raw").value = EX.ok;
$("scan").onclick = async () => {
  $("err").textContent = "";
  const raw = $("raw").value.trim();
  if (!raw) { $("err").textContent = "Paste an email first."; return; }
  try {
    const r = await fetch("/scan", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ raw }) });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const d = await r.json();
    const color = d.risk === "high" ? "var(--bad)" : d.risk === "medium" ? "var(--warn)" : "var(--ok)";
    $("result").style.display = "block";
    $("verdict").textContent = d.label === "fraud" ? "Likely fraud" : "Looks legitimate";
    $("verdict").style.color = color;
    $("fill").style.width = Math.round(d.score * 100) + "%";
    $("fill").style.background = color;
    $("detail").textContent = "Fraud score " + d.score.toFixed(2) + " · " + d.risk + " risk";
    $("chips").replaceChildren(...(d.signals.length ? d.signals : ["no suspicious signals"]).map(s => {
      const c = document.createElement("span"); c.className = "chip"; c.textContent = s.replaceAll("_", " "); return c; }));
  } catch (e) { $("err").textContent = "Error: " + e.message; }
};
</script>
</body>
</html>
