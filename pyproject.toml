[project]
name = "email-fraud-detection"
version = "0.2.0"
description = "Detect phishing and fraudulent emails with explainable heuristics plus a TF-IDF classifier."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amar Mujacic" }]
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.5", "pandas>=2.2", "joblib>=1.4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications :: Email :: Filters",
    "Topic :: Security",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "fastapi>=0.115", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/amujacic2/Email-Fraud-Detection"
Issues = "https://github.com/amujacic2/Email-Fraud-Detection/issues"

[project.scripts]
emailfraud = "emailfraud.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emailfraud = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
